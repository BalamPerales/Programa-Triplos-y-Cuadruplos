<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TriploCuadruplos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-10">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white text-center py-3">
                        <h4 class="mb-0">Cuádruplos y Tríplos</h4>
                    </div>
                    <div class="card-body p-4">
                        
                        <!-- Input Section -->
                        <div class="input-group mb-4">
                            <span class="input-group-text bg-secondary text-white border-secondary">Expresión:</span>
                            <input type="text" id="expresion" class="form-control border-secondary" placeholder="" value="">
                            <button class="btn btn-primary px-4" id="btn-procesar">Generar Tablas</button>
                            <button class="btn btn-danger px-4" id="btn-limpiar">Limpiar</button>
                        </div>

                        <div class="row">

                            <!-- Tabla de Cuádruplos -->
                            <div class="col-md-6 mb-4">
                                <h5 class="text-center text-primary mb-3">Tabla de Cuádruplos</h5>
                                <div class="table-responsive">
                                    <table class="table table-bordered table-striped table-hover text-center">
                                        <thead class="table-dark">
                                            <tr>
                                                <th>Operador</th>
                                                <th>Dato 1</th>
                                                <th>Dato 2</th>
                                                <th>Resultado</th>
                                            </tr>
                                        </thead>
                                        <tbody id="body-cuadruplos">
                                            <tr><td colspan="4" class="text-muted">Esperando expresión...</td></tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                            <!-- Tabla de Tríplos -->
                            <div class="col-md-6 mb-4">
                                <h5 class="text-center text-success mb-3">Tabla de Tríplos</h5>
                                <div class="table-responsive">
                                    <table class="table table-bordered table-striped table-hover text-center">
                                        <thead class="table-dark">
                                            <tr>
                                                <th>Índice</th>
                                                <th>Operador</th>
                                                <th>Dato 1</th>
                                                <th>Dato 2</th>
                                            </tr>
                                        </thead>
                                        <tbody id="body-triplos">
                                            <tr><td colspan="4" class="text-muted">Esperando expresión...</td></tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="public/js/index.js"></script>
</body>
</html>
